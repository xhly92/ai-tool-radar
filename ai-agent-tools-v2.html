function renderAgentFilters(){document.querySelector('#agentFilters').innerHTML=agentCats.map(c=>`<button class="${c===agentCat?'active':''}" data-agent-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-agent-cat]').forEach(b=>b.onclick=()=>{agentCat=b.dataset.agentCat;renderAgentFilters();loadAgents(false)})}
function currentAgents(){return agentCat==='全部'?agents:agents.filter(a=>a.cat===agentCat)}
function renderAgents(){const list=currentAgents().map(a=>({...a,...agentData[a.repo]})).sort((a,b)=>(b.stars||0)-(a.stars||0));if(!list.length){document.querySelector('#agentList').innerHTML='<div class="agentState">该分类暂无项目</div>';return}document.querySelector('#agentList').innerHTML=list.map((a,i)=>`<a class="agentRow" href="https://github.com/${a.repo}" target="_blank" rel="noreferrer"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="repo"><strong>${a.repo}</strong><small>${a.language||'AI Agent'}${a.updated?' · 最近更新 '+a.updated:''}</small></span><span class="agentUse">${a.use}</span><span class="stars">★ ${a.stars==null?'读取中':compact(a.stars)}<small>GitHub Stars</small></span><span class="agentArrow">↗</span></a>`).join('')}
async function loadAgents(force){if(agentBusy)return;agentBusy=true;const btn=document.querySelector('#agentRefresh');btn.classList.add('busy');btn.disabled=true;renderAgents();let ok=0;const list=currentAgents();for(let i=0;i<list.length;i+=5){await Promise.all(list.slice(i,i+5).map(async a=>{if(!force&&agentData[a.repo]){ok++;return}try{const r=await fetch('https://api.github.com/repos/'+a.repo,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status);const d=await r.json();agentData[a.repo]={stars:d.stargazers_count,language:d.language||'AI Agent',updated:(d.pushed_at||'').slice(0,10)};ok++}catch(e){if(!agentData[a.repo])agentData[a.repo]={stars:null,language:'暂时无法读取'}}}));renderAgents()}document.querySelector('#agentUpdated').textContent=ok?`已读取 ${ok} 个项目 · ${new Date().toLocaleString('zh-CN')} · GitHub 公开 API`:'读取失败，请检查网络后点击更新';btn.classList.remove('busy');btn.disabled=false;agentBusy=false}
document.querySelector('#agentRefresh').onclick=()=>loadAgents(true);renderAgentFilters();loadAgents(false);
</script>
</body>
</html>
