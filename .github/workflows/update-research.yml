name: Refresh research and publish Pages
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'us-research-radar-3.html'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/update-research.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Collect official sources
        id: collect
        continue-on-error: true
        run: python scripts/update_research.py
      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public research sources'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp *.html _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Flag total source outage after publishing status
        if: steps.collect.outcome == 'failure'
        run: exit 1
